plugins {
    id "com.android.application"
    // AGP 9 supplies built-in Kotlin (KGP 2.2.10); only the matching Compose compiler
    // plugin is applied. Applying kotlin-android would register Kotlin twice.
    id "org.jetbrains.kotlin.plugin.compose"
}

// Build identity for the About screen. A build must be able to name the source it came
// from without the developer having to remember; a failure to read git is not worth
// failing the build over.
def gitOutput = { List<String> command, String fallback ->
    try {
        providers.exec {
            commandLine command
            workingDir = rootProject.projectDir
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        fallback
    }
}
def uuCommit = gitOutput(["git", "rev-parse", "--short", "HEAD"], "") ?: ""
if (uuCommit.isEmpty()) uuCommit = "nogit"
def uuDirty = !gitOutput(["git", "status", "--porcelain"], "").isEmpty()

// The yt-dlp wrapper, the Python runtime and ffmpeg are pinned together: the Python
// payload and the yt-dlp build are released as one set and must not be mixed.
def youtubedlAndroid = "0.18.1"

// ---- size: is ffmpeg carried in this build? ----------------------------------
//
// ffmpeg is what lets yt-dlp merge a video stream and an audio stream into one file. It is
// also, by a wide margin, the largest thing in the APK: about 35 MB per ABI. Most sites in the
// app's list (TikTok, Instagram, Facebook, X, Reddit, the adult sites) already serve one muxed
// MP4, so ffmpeg buys them nothing — its only real job is YouTube above 720p.
//
// On by default, because it is what makes YouTube HQ real. `-PuuFfmpeg=false` builds the
// small variant (~40 MB per ABI) where format selection asks for one already-muxed file
// instead: YouTube then tops out at its best pre-muxed stream, usually 720p.
def uuFfmpeg = (findProperty("uuFfmpeg") ?: "true").toString().toBoolean()

android {
    namespace "au.com.uulabs.uudownloader"
    compileSdk 36

    defaultConfig {
        // The identifier is the app's identity on a handset: changing it installs a second,
        // empty app rather than upgrading this one.
        applicationId "au.com.uulabs.uudownloader"
        // 29 is the floor for MediaStore.Downloads, which is how the default destination
        // works without asking for any storage permission at all.
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "1.0.2"

        buildConfigField "String", "UU_COMMIT", "\"${uuCommit}${uuDirty ? "-dirty" : ""}\""
        buildConfigField "boolean", "UU_FFMPEG", "${uuFfmpeg}"

        // Both test handsets are ARM (a 32-bit Blade A3 Plus and a 64-bit arm64 device).
        // Shipping x86 payloads nobody will run only makes the download bigger.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        // A personal app that is sideloaded, never uploaded: the debug key is the honest
        // choice here, and it means a release build can update the debug install in place.
        release {
            def debugKey = new File(System.getProperty("user.home"), ".android/debug.keystore")
            if (debugKey.exists()) {
                storeFile debugKey
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // The APK is dominated by native payloads (ffmpeg, Python), so shrinking is a
            // small win rather than a large one — but it also strips the parts of Compose and
            // the yt-dlp wrapper this app never calls, and there is no reason to ship those.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Sideloaded, never uploaded: the debug key is the honest choice, and it means a
            // release build can update a debug install in place.
            signingConfig signingConfigs.release
        }
    }

    // One APK per ABI as well as a universal one: the Python runtime is the other big
    // passenger and a phone only ever needs one of them.
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }

    packaging {
        jniLibs {
            if (!uuFfmpeg) {
                excludes += ["**/libffmpeg.zip.so", "**/libffmpeg.so"]
            }
            // youtubedl-android unpacks libpython.zip.so and executes the python, ffmpeg and
            // quickjs binaries straight out of ApplicationInfo.nativeLibraryDir. With the
            // modern default (extractNativeLibs=false) those files are not on disk at all,
            // so the runtime cannot start. This is the documented requirement of the library,
            // not a sizing preference.
            useLegacyPackaging = true
        }
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    testOptions {
        unitTests {
            // android.jar's org.json is a stub that throws. The core is pure Kotlin and is
            // tested on the JVM; the real org.json comes from the testImplementation below.
            returnDefaultValues = true
        }
    }

    sourceSets {
        main.kotlin.srcDirs += "src/main/kotlin"
        test.kotlin.srcDirs += "src/test/kotlin"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroid"
    // Kept on the classpath so FFmpeg.init can be called safely; its binaries are excluded
    // from packaging unless -PuuFfmpeg=true.
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroid"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit"
    testImplementation "org.json:json:20240303"
}
