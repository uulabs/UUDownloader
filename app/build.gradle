plugins {
    id "com.android.application"
    // AGP 9 supplies built-in Kotlin (KGP 2.2.10); only the matching Compose compiler
    // plugin is applied. Applying kotlin-android would register Kotlin twice.
    id "org.jetbrains.kotlin.plugin.compose"
}

// Build identity for the About screen. A build must be able to name the source it came
// from without the developer having to remember; a failure to read git is not worth
// failing the build over.
def gitOutput = { List<String> command, String fallback ->
    try {
        providers.exec {
            commandLine command
            workingDir = rootProject.projectDir
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        fallback
    }
}
def uuCommit = gitOutput(["git", "rev-parse", "--short", "HEAD"], "") ?: ""
if (uuCommit.isEmpty()) uuCommit = "nogit"
def uuDirty = !gitOutput(["git", "status", "--porcelain"], "").isEmpty()

// The yt-dlp wrapper, the Python runtime and ffmpeg are pinned together: the Python
// payload and the yt-dlp build are released as one set and must not be mixed.
def youtubedlAndroid = "0.18.1"

// ---- size: is ffmpeg carried in this build? ----------------------------------
//
// ffmpeg is what lets yt-dlp merge a video stream and an audio stream into one file. It is
// also, by a wide margin, the largest thing in the APK: about 35 MB per ABI. Most sites already
// serve one muxed MP4, so ffmpeg buys them nothing — its only real job is YouTube above 720p.
//
// On by default, because it is what makes YouTube HQ real. `-PuuFfmpeg=false` builds the
// small variant (~40 MB per ABI) where format selection asks for one already-muxed file
// instead: YouTube then tops out at its best pre-muxed stream, usually 720p.
def uuFfmpeg = (findProperty("uuFfmpeg") ?: "true").toString().toBoolean()

// The engine runs with access to the user's cookies, so the copy in the APK has to be the one
// yt-dlp published. This is the `yt-dlp` line of that release's SHA2-256SUMS.
def uuEngineSha256 = "e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3"

def verifyBundledEngine = tasks.register("verifyBundledEngine") {
    def engine = file("src/main/assets/ytdlp")
    inputs.file(engine)
    doLast {
        def actual = java.security.MessageDigest.getInstance("SHA-256").digest(engine.bytes).encodeHex().toString()
        if (actual != uuEngineSha256) {
            throw new GradleException("assets/ytdlp is $actual, expected $uuEngineSha256. Update uuEngineSha256 " +
                "only from the checksums yt-dlp published for that release.")
        }
    }
}
tasks.named("preBuild") { dependsOn(verifyBundledEngine) }

// A release has to be able to name the source it came from, and GPL recipients are owed exactly
// that source. A build from uncommitted work cannot do either.
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.name ==~ /(assemble|package|bundle).*Release.*/ }
    if (releasing && uuDirty && !findProperty("uuAllowDirty")) {
        throw new GradleException("Refusing to build a release from a dirty tree. Commit first " +
            "(-PuuAllowDirty=true only for a build that will not be published).")
    }
}

android {
    namespace "au.com.uulabs.uudownloader"
    compileSdk 36

    defaultConfig {
        // The identifier is the app's identity on a handset: changing it installs a second,
        // empty app rather than upgrading this one.
        applicationId "au.com.uulabs.uudownloader"
        // 29 is the floor for MediaStore.Downloads, which is how the default destination
        // works without asking for any storage permission at all.
        minSdk 29
        targetSdk 36
        versionCode 21
        versionName "1.6.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "UU_COMMIT", "\"${uuCommit}${uuDirty ? "-dirty" : ""}\""
        buildConfigField "boolean", "UU_FFMPEG", "${uuFfmpeg}"
        // Both test handsets are ARM (a 32-bit Blade A3 Plus and a 64-bit arm64 device).
        // Shipping x86 payloads nobody will run only makes the download bigger.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        // A real key, not androiddebugkey.
        //
        // Play Protect reports an APK signed with the debug certificate as an unknown
        // publisher, and it treats "an app that downloads and installs APKs" as the shape of
        // malware. The debug identity made both signals louder. This key lives outside the
        // repository (SigningKeys/ is ignored) and never changes: losing it would strand every
        // installed copy.
        release {
            def propsFile = rootProject.file("SigningKeys/keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props.getProperty("storeFile"))
                storePassword props.getProperty("storePassword")
                keyAlias props.getProperty("keyAlias")
                keyPassword props.getProperty("keyPassword")
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            } else {
                // No key on this machine: still build, but say so rather than pretend.
                logger.warn("UU: SigningKeys/keystore.properties is missing — the release APK will be unsigned.")
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // The APK is dominated by native payloads (ffmpeg, Python), so shrinking is a
            // small win rather than a large one — but it also strips the parts of Compose and
            // the yt-dlp wrapper this app never calls, and there is no reason to ship those.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Assigning a config with no key would fail the build rather than leave it unsigned.
            if (rootProject.file("SigningKeys/keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // One APK per ABI as well as a universal one: the Python runtime is the other big
    // passenger and a phone only ever needs one of them.
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }

    packaging {
        jniLibs {
            if (!uuFfmpeg) {
                excludes += ["**/libffmpeg.zip.so", "**/libffmpeg.so"]
            }
            // youtubedl-android unpacks libpython.zip.so and executes the python, ffmpeg and
            // quickjs binaries straight out of ApplicationInfo.nativeLibraryDir. With the
            // modern default (extractNativeLibs=false) those files are not on disk at all,
            // so the runtime cannot start. This is the documented requirement of the library,
            // not a sizing preference.
            useLegacyPackaging = true
        }
        resources {
            excludes += ["META-INF/DEPENDENCIES"]
            // Apache-licensed libraries require their notices to travel with the app, so
            // duplicates are joined rather than dropped.
            merges += ["META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    testOptions {
        unitTests {
            // android.jar's org.json is a stub that throws. The core is pure Kotlin and is
            // tested on the JVM; the real org.json comes from the testImplementation below.
            returnDefaultValues = true
        }
    }

    sourceSets {
        main.kotlin.srcDirs += "src/main/kotlin"
        test.kotlin.srcDirs += "src/test/kotlin"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.activity:activity-compose:1.12.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    implementation platform("androidx.compose:compose-bom:2026.03.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroid"
    // Kept on the classpath so FFmpeg.init can be called safely; -PuuFfmpeg=false leaves its
    // binaries out of the package.
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroid"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit"
    testImplementation "org.json:json:20240303"

    androidTestImplementation "androidx.test:core-ktx:1.7.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.test.ext:junit-ktx:1.3.0"
}
